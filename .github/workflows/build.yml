# Mac版・Windows版のアプリを自動で組み立てる
#   main に push        → テスト＋組み立て（Actions画面から試用版をダウンロードできる）
#   v で始まるタグを push → さらにリリースの「下書き」を作る（公開は手動）
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest certifi
      - run: python -m pytest -q

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: MailBulkTidy-mac
          - os: windows-latest
            artifact: MailBulkTidy-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller certifi

      - name: Build (Mac)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --windowed --name MailBulkTidy --collect-data certifi app.py
          ditto -c -k --keepParent dist/MailBulkTidy.app MailBulkTidy-mac.zip

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller --noconfirm --windowed --name MailBulkTidy --collect-data certifi app.py
          Compress-Archive -Path dist/MailBulkTidy -DestinationPath MailBulkTidy-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - run: sha256sum *.zip > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            *.zip
            SHA256SUMS.txt
